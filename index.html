<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Nacional Calidad - WRC</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="cabecera">
    <div class="cabecera-izq">
        <h1 class="logo">🌹 WRC · Nacional</h1>
    </div>

    <div class="cabecera-centro">
        <label class="campo">
            <span>Fecha</span>
            <input type="date" id="input-fecha">
        </label>
        <label class="campo">
            <span>Proveedor</span>
            <select id="select-proveedor">
                <option value="">-- Seleccionar --</option>
            </select>
        </label>
        <label class="campo">
            <span>Zona</span>
            <select id="select-zona">
                <option value="">--</option>
            </select>
        </label>
    </div>

    <div class="cabecera-der">
        <div id="indicador-sync" class="sync-indicador online">
            <span id="sync-icono">🟢</span>
            <span id="sync-texto">En línea</span>
            <span id="sync-pendientes" class="sync-badge" style="display:none;">0</span>
        </div>
        <button id="btn-admin" class="btn-accion">⚙️ Admin</button>
        <button id="btn-transacciones" class="btn-accion">📋 Ver</button>
        <button id="btn-excel" class="btn-accion">🖨️ Excel</button>
        <button id="btn-guardar" class="btn-guardar">Guardar</button>
    </div>
</header>

<main class="contenedor">
    <section class="columna col-1">
        <div class="panel panel-mesas">
            <div class="panel-header">
                <h2>Mesas</h2>
                <button class="lupa" data-target="filtro-mesas">🔍</button>
            </div>
            <input type="text" id="filtro-mesas" class="filtro-buscador" placeholder="Buscar mesa...">
            <div class="lista-items" id="lista-mesas"></div>
        </div>
        <div class="panel panel-clasificadores">
            <div class="panel-header">
                <h2>Clasificadores</h2>
                <button class="lupa" data-target="filtro-clasificadores">🔍</button>
            </div>
            <input type="text" id="filtro-clasificadores" class="filtro-buscador" placeholder="Buscar clasificador...">
            <div class="lista-items" id="lista-clasificadores"></div>
        </div>
    </section>

    <section class="columna col-2">
        <div class="panel">
            <div class="panel-header">
                <h2>Variedades</h2>
                <button class="lupa" data-target="filtro-variedades">🔍</button>
            </div>
            <input type="text" id="filtro-variedades" class="filtro-buscador" placeholder="Buscar variedad...">
            <div class="lista-items" id="lista-variedades"></div>
        </div>
    </section>

    <section class="columna col-3">
        <div class="panel">
            <div class="panel-header">
                <h2>Plagas / Enfermedades</h2>
                <button class="lupa" data-target="filtro-plagas">🔍</button>
            </div>
            <input type="text" id="filtro-plagas" class="filtro-buscador" placeholder="Buscar plaga...">
            <div class="lista-items" id="lista-plagas"></div>
        </div>
    </section>

    <section class="columna col-4">
        <div class="panel panel-numpad">
            <h2>Cantidad</h2>
            <div id="display-cantidad" class="display-cantidad">0</div>
            <div class="numpad">
                <button class="numpad-btn" data-num="1">1</button>
                <button class="numpad-btn" data-num="2">2</button>
                <button class="numpad-btn" data-num="3">3</button>
                <button class="numpad-btn" data-num="4">4</button>
                <button class="numpad-btn" data-num="5">5</button>
                <button class="numpad-btn" data-num="6">6</button>
                <button class="numpad-btn" data-num="7">7</button>
                <button class="numpad-btn" data-num="8">8</button>
                <button class="numpad-btn" data-num="9">9</button>
                <button class="numpad-btn" data-num="0">0</button>
                <button id="btn-borrar" class="numpad-btn numpad-funcion">⌫</button>
                <button id="btn-limpiar" class="numpad-btn numpad-funcion">C</button>
            </div>
        </div>
    </section>
</main>

<!-- MODAL PIN -->
<div id="modal-pin" class="modal">
    <div class="modal-contenido modal-pin-contenido">
        <h3>🔒 Acceso Admin</h3>
        <div id="pin-puntos" class="pin-puntos">○○○○</div>
        <div class="pin-pad">
            <button class="pin-btn" data-pin="1">1</button>
            <button class="pin-btn" data-pin="2">2</button>
            <button class="pin-btn" data-pin="3">3</button>
            <button class="pin-btn" data-pin="4">4</button>
            <button class="pin-btn" data-pin="5">5</button>
            <button class="pin-btn" data-pin="6">6</button>
            <button class="pin-btn" data-pin="7">7</button>
            <button class="pin-btn" data-pin="8">8</button>
            <button class="pin-btn" data-pin="9">9</button>
            <button id="pin-cerrar" class="pin-btn pin-funcion">✖</button>
            <button class="pin-btn" data-pin="0">0</button>
            <button id="pin-borrar" class="pin-btn pin-funcion">⌫</button>
        </div>
    </div>
</div>

<!-- MODAL ADMIN -->
<div id="modal-admin" class="modal">
    <div class="modal-contenido modal-admin-contenido">
        <div class="modal-header">
            <h3>⚙️ Administración de Listas</h3>
            <button id="admin-cerrar" class="btn-cerrar">✖</button>
        </div>
        <div class="admin-grid">
            <div class="admin-seccion">
                <h4>Proveedores</h4>
                <div class="admin-add">
                    <input type="text" id="input-admin-proveedor" placeholder="Nuevo proveedor...">
                    <button data-admin-add="proveedor">➕</button>
                </div>
                <div id="admin-proveedores" class="admin-lista"></div>
            </div>
            <div class="admin-seccion">
                <h4>Zonas</h4>
                <div class="admin-add">
                    <input type="text" id="input-admin-zona" placeholder="Nueva zona...">
                    <button data-admin-add="zona">➕</button>
                </div>
                <div id="admin-zonas" class="admin-lista"></div>
            </div>
            <div class="admin-seccion">
                <h4>Clasificadores</h4>
                <div class="admin-add">
                    <input type="text" id="input-admin-clasificador" placeholder="Nuevo clasificador...">
                    <button data-admin-add="clasificador">➕</button>
                </div>
                <div id="admin-clasificadores" class="admin-lista"></div>
            </div>
            <div class="admin-seccion">
                <h4>Mesas</h4>
                <div class="admin-add">
                    <input type="text" id="input-admin-mesa" placeholder="Nueva mesa...">
                    <button data-admin-add="mesa">➕</button>
                </div>
                <div id="admin-mesas" class="admin-lista"></div>
            </div>
            <div class="admin-seccion">
                <h4>Variedades</h4>
                <div class="admin-add">
                    <input type="text" id="input-admin-variedad" placeholder="Nueva variedad...">
                    <button data-admin-add="variedad">➕</button>
                </div>
                <div id="admin-variedades" class="admin-lista"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL TRANSACCIONES -->
<div id="modal-transacciones" class="modal">
    <div class="modal-contenido modal-tx-contenido">
        <div class="modal-header">
            <h3>📋 Transacciones Registradas</h3>
            <button id="transacciones-cerrar" class="btn-cerrar">✖</button>
        </div>
        <div class="tx-tabla-wrapper">
            <table class="tx-tabla">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th>Mesa</th>
                        <th>Clasif.</th>
                        <th>Variedad</th>
                        <th>Plaga</th>
                        <th>Cant.</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="transacciones-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
