<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1565c0">
<title>WRC · Registro Nacional Calidad</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    WORLD ROSES CENTER
    <small>Registro Nacional Calidad</small>
  </div>

  <div class="campos">
    <div class="campo campo-fecha">
      <label for="fecha">FECHA</label>
      <input type="date" id="fecha">
    </div>
    <div class="campo">
      <label for="proveedor">PROVEEDOR</label>
      <select id="proveedor"></select>
    </div>
    <div class="campo campo-zona">
      <label for="zona">ZONA</label>
      <select id="zona"></select>
    </div>
  </div>

  <div class="acciones">
    <span class="estado-red" id="estadoRed" title="Estado de conexión">●</span>
    <button type="button" class="icon-btn" id="btnAdmin"   title="Administración">⚙️</button>
    <button type="button" class="icon-btn" id="btnTrans"   title="Ver transacciones">📋</button>
    <button type="button" class="icon-btn" id="btnExcel"   title="Exportar Excel">🖨️</button>
    <button type="button" class="save-btn" id="btnGuardar">GUARDAR</button>
  </div>
</header>

<main class="grid">

  <section class="col col-1">
    <div class="panel">
      <div class="panel-head">
        <span>MESAS</span>
        <input type="search" class="buscador" id="buscarMesas" placeholder="🔍">
      </div>
      <div class="lista" id="listaMesas"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span>CLASIFICADORES</span>
        <input type="search" class="buscador" id="buscarClasificadores" placeholder="🔍">
      </div>
      <div class="lista" id="listaClasificadores"></div>
    </div>
  </section>

  <section class="col col-2">
    <div class="panel">
      <div class="panel-head">
        <span>VARIEDADES</span>
        <input type="search" class="buscador" id="buscarVariedades" placeholder="🔍">
      </div>
      <div class="lista" id="listaVariedades"></div>
    </div>
  </section>

  <section class="col col-3">
    <div class="panel">
      <div class="panel-head">
        <span>PLAGAS</span>
        <input type="search" class="buscador" id="buscarPlagas" placeholder="🔍">
      </div>
      <div class="lista" id="listaPlagas"></div>
    </div>
  </section>

  <section class="col col-4">
    <div class="panel panel-resumen">
      <div class="resumen">
        <div class="rz"><span>MESA</span><b id="rzMesa">—</b></div>
        <div class="rz"><span>CLASIF.</span><b id="rzClasif">—</b></div>
        <div class="rz"><span>VARIEDAD</span><b id="rzVariedad">—</b></div>
        <div class="rz"><span>PLAGA</span><b id="rzPlaga">—</b></div>
      </div>
    </div>

    <div class="panel panel-teclado">
      <div class="pantalla" id="pantalla">0</div>
      <div class="teclado" id="teclado">
        <button type="button" class="tecla" data-tecla="1">1</button>
        <button type="button" class="tecla" data-tecla="2">2</button>
        <button type="button" class="tecla" data-tecla="3">3</button>
        <button type="button" class="tecla" data-tecla="4">4</button>
        <button type="button" class="tecla" data-tecla="5">5</button>
        <button type="button" class="tecla" data-tecla="6">6</button>
        <button type="button" class="tecla" data-tecla="7">7</button>
        <button type="button" class="tecla" data-tecla="8">8</button>
        <button type="button" class="tecla" data-tecla="9">9</button>
        <button type="button" class="tecla tecla-fn" data-tecla="C">C</button>
        <button type="button" class="tecla" data-tecla="0">0</button>
        <button type="button" class="tecla tecla-fn" data-tecla="B">⌫</button>
      </div>
    </div>
  </section>

</main>

<div class="overlay" id="modalPin">
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2>🔒 Acceso administrador</h2>
      <button type="button" class="cerrar" data-cerrar="modalPin">✕</button>
    </div>
    <div class="modal-body centro">
      <input type="password" id="pinInput" inputmode="numeric" maxlength="8"
             class="pin-input" placeholder="••••" autocomplete="off">
      <p class="error-pin" id="pinError"></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-cerrar="modalPin">Cancelar</button>
      <button type="button" class="btn btn-primary" id="pinOk">Entrar</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalAdmin">
  <div class="modal modal-lg">
    <div class="modal-head">
      <h2>⚙️ Administración de catálogos</h2>
      <button type="button" class="cerrar" data-cerrar="modalAdmin">✕</button>
    </div>
    <div class="tabs" id="adminTabs"></div>
    <div class="modal-body admin-body">
      <div class="admin-add">
        <input type="text" id="adminNuevo" placeholder="Nuevo elemento..." autocomplete="off">
        <button type="button" class="btn btn-primary" id="adminAgregar">+ Agregar</button>
      </div>
      <div class="admin-lista" id="adminLista"></div>
    </div>
    <div class="modal-foot">
      <label class="usuario-label">
        Operario:
        <input type="text" id="usuarioInput" maxlength="24" placeholder="TABLET-1">
      </label>
      <button type="button" class="btn btn-ghost" data-cerrar="modalAdmin">Cerrar</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalTrans">
  <div class="modal modal-xl">
    <div class="modal-head">
      <h2>📋 Transacciones · <span id="transFecha"></span></h2>
      <button type="button" class="cerrar" data-cerrar="modalTrans">✕</button>
    </div>
    <div class="modal-body">
      <div class="trans-barra">
        <input type="search" id="buscarTrans" class="buscador-texto" placeholder="🔍 Buscar mesa, variedad, plaga...">
        <span class="contador" id="transContador">0 registros</span>
      </div>
      <div class="tabla-wrap">
        <table class="tabla">
          <thead>
            <tr>
              <th>FECHA</th><th>MESA</th><th>CLASIF.</th><th>VARIEDAD</th>
              <th>PLAGA</th><th>TALLOS</th><th>ESTADO</th><th></th>
            </tr>
          </thead>
          <tbody id="tablaTrans"></tbody>
        </table>
      </div>
    </div>
    <div class="modal-foot">
      <span class="leyenda"><i class="dot pendiente"></i> Pendiente de subir &nbsp;
                            <i class="dot sincronizado"></i> Sincronizado</span>
      <button type="button" class="btn btn-ghost" data-cerrar="modalTrans">Cerrar</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
